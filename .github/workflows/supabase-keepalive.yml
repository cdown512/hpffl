name: Supabase keep-alive

# Supabase pauses Free Plan projects after ~7 days of low activity. This pings
# one table daily so a missed run or two can't let the timer run out.
#
# Setup: repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL   https://wsvlicolbjwppnamuziw.supabase.co
#   SUPABASE_KEY   your sb_publishable_... key
# (The publishable key is enough — this only reads.)

on:
  schedule:
    - cron: '17 13 * * *'     # daily, 13:17 UTC
  workflow_dispatch:           # also runnable by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-24.04      # pinned; avoids the ubuntu-latest → 26 migration
    timeout-minutes: 5
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/eras?select=id&limit=1")
          echo "HTTP $code"
          cat /tmp/out.txt
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP $code — the project may be paused."
            exit 1
          fi